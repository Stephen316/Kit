# Gitleaks extends the upstream default rule set so third-party detections
# stay current, then narrows scope to the directories this repository audits.
title = "Kit gitleaks policy"

[extend]
useDefault = true

[allowlist]
description = "Paths outside the CI security boundary, and DWG named object dictionary keys"
paths = [
    '''(^|/)\.venv(/|$)''',
    '''(^|/)examples(/|$)''',
    '''(^|/)Parashell(/|$)''',
    '''(^|/)modules(/|$)''',
    '''(^|/)re(/|$)''',
]
regexes = [
    '''^NOD/[A-Za-z_]+$''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Historical Python keyword argument axis_kind=None is source syntax"
condition = "AND"
commits = ["86ab1082a65054afb2c2022c77b18cd3a6b59908"]
paths = ['''^src/convert/adapters/solidworks/resolved/Core\.py$''']
regexes = ['''^axis_kind=None$''']
