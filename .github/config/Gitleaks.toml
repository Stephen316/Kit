# Gitleaks extends the upstream default rule set so third-party detections
# stay current, then narrows scope to the directories this repository audits.
title = "Kit gitleaks policy"

[extend]
useDefault = true

[allowlist]
description = "Paths outside the CI security boundary, and DWG named object dictionary keys"
paths = [
    '''(^|/)\.venv(/|$)''',
    '''(^|/)examples(/|$)''',
    '''(^|/)Parashell(/|$)''',
    '''(^|/)modules(/|$)''',
    '''(^|/)re(/|$)''',
]
regexes = [
    '''^NOD/[A-Za-z_]+$''',
]
