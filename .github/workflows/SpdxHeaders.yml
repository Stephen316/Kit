name: SPDX headers

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      github.event.pull_request.number ||
      github.event.merge_group.head_ref ||
      github.ref
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-headers:
    name: Verify changed file headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
      result: ${{ steps.verify.outcome }}
      remediation-attempted: >-
        ${{ steps.remediation-state.outputs.cache-hit == 'true' }}
    steps:
      # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.base.sha ||
              github.sha
            }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked trusted environment
        run: uv sync --frozen --python 3.11

      - name: Determine exact comparison commits
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              BaseSha="$PULL_BASE_SHA"
              HeadSha="$PULL_HEAD_SHA"
              ;;
            merge_group)
              BaseSha="$MERGE_BASE_SHA"
              HeadSha="$MERGE_HEAD_SHA"
              ;;
            push)
              BaseSha="$PUSH_BASE_SHA"
              HeadSha="$PUSH_HEAD_SHA"
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac
          if ! [[ "$BaseSha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Base commit is not an exact lowercase SHA."
            exit 1
          fi
          if ! [[ "$HeadSha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Head commit is not an exact lowercase SHA."
            exit 1
          fi
          if [ "$BaseSha" = "0000000000000000000000000000000000000000" ]; then
            BaseSha="$(git rev-list --max-parents=0 "$HeadSha" | tail -n 1)"
          fi
          if ! [[ "$BaseSha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Fallback base commit is not an exact lowercase SHA."
            exit 1
          fi
          echo "base=$BaseSha" >> "$GITHUB_OUTPUT"
          echo "head=$HeadSha" >> "$GITHUB_OUTPUT"

      - name: Materialize pull request head as detached data
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi
          if ! [[ "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            exit 1
          fi
          PullRef="refs/pull/$PULL_NUMBER/head"
          git fetch --no-tags origin "$PullRef"
          FetchedSha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          if [ "$FetchedSha" != "$HEAD_SHA" ]; then
            echo "::error::Fetched pull request data does not match the event SHA."
            exit 1
          fi
          git worktree add --detach "$GITHUB_WORKSPACE/SpdxHeadData" "$HEAD_SHA"

      - name: Materialize the exact untrusted head
        id: source
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SourceRoot="$GITHUB_WORKSPACE/SpdxHeadData"
            DataHead="$(git -C "$SourceRoot" rev-parse HEAD)"
            if [ "$DataHead" != "$HEAD_SHA" ]; then
              echo "::error::Detached pull request data does not match the event SHA."
              exit 1
            fi
            git -C "$SourceRoot" fetch --no-tags "$GITHUB_WORKSPACE" "$BASE_SHA"
          else
            SourceRoot="$RUNNER_TEMP/SpdxHeaderSource"
            git worktree add --detach "$SourceRoot" "$HEAD_SHA"
          fi
          if [ "$(git -C "$SourceRoot" cat-file -t "$BASE_SHA")" != "commit" ]; then
            exit 1
          fi
          if [ "$(git -C "$SourceRoot" cat-file -t "$HEAD_SHA")" != "commit" ]; then
            exit 1
          fi
          echo "path=$SourceRoot" >> "$GITHUB_OUTPUT"

      - name: Restore remediation state for this head
        id: remediation-state
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/SpdxHeaderRemediation
          key: >-
            SpdxHeaderRemediation-${{ github.repository_id }}-${{
              github.event.pull_request.number
            }}-${{ steps.refs.outputs.head }}

      - name: Verify headers from trusted code
        id: verify
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          SOURCE_ROOT: ${{ steps.source.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python .github/scripts/VerifySpdxHeaders.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --worktree "$SOURCE_ROOT"

  remediate-missing-headers:
    name: Remediate missing SPDX headers
    needs: verify-headers
    if: >-
      needs.verify-headers.outputs.result == 'failure' &&
      needs.verify-headers.outputs.remediation-attempted != 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Pushes validated header-only repairs to same-repository branches.
    steps:
      # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked trusted environment
        run: uv sync --frozen --python 3.11

      - name: Materialize pull request head as detached data
        env:
          HEAD_SHA: ${{ needs.verify-headers.outputs.head }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi
          if ! [[ "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            exit 1
          fi
          PullRef="refs/pull/$PULL_NUMBER/head"
          git fetch --no-tags origin "$PullRef"
          FetchedSha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          if [ "$FetchedSha" != "$HEAD_SHA" ]; then
            echo "::error::Fetched pull request data does not match the event SHA."
            exit 1
          fi
          git worktree add --detach "$GITHUB_WORKSPACE/SpdxHeadData" "$HEAD_SHA"

      - name: Validate the repair target
        id: target
        env:
          BASE_SHA: ${{ needs.verify-headers.outputs.base }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ needs.verify-headers.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi
          if ! git check-ref-format --branch "$HEAD_REF" >/dev/null; then
            echo "::error::The pull request head branch is not a valid branch name."
            exit 1
          fi
          NormalizedRef="${HEAD_REF,,}"
          case "$NormalizedRef" in
            main|master|release|release/*)
              echo "::error::Protected branches cannot be remediation targets."
              exit 1
              ;;
          esac
          if ! git check-ref-format "refs/heads/$HEAD_REF"; then
            echo "::error::The explicit pull request head ref is invalid."
            exit 1
          fi
          DataHead="$(git -C SpdxHeadData rev-parse HEAD)"
          if [ "$DataHead" != "$HEAD_SHA" ]; then
            echo "::error::Detached pull request data does not match the event SHA."
            exit 1
          fi
          git -C SpdxHeadData fetch --no-tags "$GITHUB_WORKSPACE" "$BASE_SHA"
          if [ "$(git -C SpdxHeadData cat-file -t "$BASE_SHA")" != "commit" ]; then
            exit 1
          fi
          if [ "$(git -C SpdxHeadData cat-file -t "$HEAD_SHA")" != "commit" ]; then
            exit 1
          fi
          echo "source-root=$GITHUB_WORKSPACE/SpdxHeadData" >> "$GITHUB_OUTPUT"

      - name: Repair and stage only validated paths
        id: repair
        env:
          BASE_SHA: ${{ needs.verify-headers.outputs.base }}
          HEAD_SHA: ${{ needs.verify-headers.outputs.head }}
          SOURCE_ROOT: ${{ steps.target.outputs.source-root }}
        shell: bash
        run: |
          set -euo pipefail
          EmptyHooks="$RUNNER_TEMP/SpdxEmptyHooks"
          RepairPaths="$RUNNER_TEMP/SpdxRepairedPaths"
          AllowedPaths="$RUNNER_TEMP/SpdxAllowedPaths"
          UnexpectedPaths="$RUNNER_TEMP/SpdxUnexpectedPaths"
          mkdir -p "$EmptyHooks"
          git -C "$SOURCE_ROOT" config core.hooksPath "$EmptyHooks"
          uv run --frozen python .github/scripts/VerifySpdxHeaders.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --worktree "$SOURCE_ROOT" \
            --fix-missing
          git -C "$SOURCE_ROOT" diff --name-only --diff-filter=M -z -- \
            > "$RepairPaths"
          if [ ! -s "$RepairPaths" ]; then
            echo "::error::The remediator did not emit any repaired paths."
            exit 1
          fi
          git diff --name-only --diff-filter=ACMR -z \
            "$BASE_SHA" "$HEAD_SHA" -- > "$AllowedPaths"
          sort -z -u "$RepairPaths" -o "$RepairPaths"
          sort -z -u "$AllowedPaths" -o "$AllowedPaths"
          comm -z -23 "$RepairPaths" "$AllowedPaths" > "$UnexpectedPaths"
          if [ -s "$UnexpectedPaths" ]; then
            echo "::error::The remediator changed a path outside the validated diff."
            exit 1
          fi
          if [ -n "$(git -C "$SOURCE_ROOT" ls-files --others --exclude-standard)" ]; then
            echo "::error::The remediator created an unexpected untracked path."
            exit 1
          fi
          git -C "$SOURCE_ROOT" add \
            --pathspec-from-file="$RepairPaths" \
            --pathspec-file-nul
          if ! git -C "$SOURCE_ROOT" diff --quiet --; then
            echo "::error::A repaired path was left unstaged."
            exit 1
          fi
          if git -C "$SOURCE_ROOT" diff --cached --quiet --; then
            echo "::error::No validated repair was staged."
            exit 1
          fi
          git -C "$SOURCE_ROOT" diff --cached --check
          git -C "$SOURCE_ROOT" config user.name "github-actions[bot]"
          git -C "$SOURCE_ROOT" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$SOURCE_ROOT" -c commit.gpgsign=false commit --no-verify \
            -m "chore: restore SPDX headers"
          RepairHead="$(git -C "$SOURCE_ROOT" rev-parse HEAD)"
          if ! [[ "$RepairHead" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi
          if [ "$(git -C "$SOURCE_ROOT" rev-parse HEAD^)" != "$HEAD_SHA" ]; then
            echo "::error::The repair commit does not directly extend the event head."
            exit 1
          fi
          git -C "$SOURCE_ROOT" diff-tree --no-commit-id --name-only -z \
            -r "$RepairHead" > "$RUNNER_TEMP/SpdxCommittedPaths"
          sort -z -u "$RUNNER_TEMP/SpdxCommittedPaths" \
            -o "$RUNNER_TEMP/SpdxCommittedPaths"
          if ! cmp -s "$RepairPaths" "$RUNNER_TEMP/SpdxCommittedPaths"; then
            echo "::error::The repair commit contains an unexpected path."
            exit 1
          fi
          if [ -n "$(git -C "$SOURCE_ROOT" status --porcelain)" ]; then
            echo "::error::The committed repair tree is not clean."
            exit 1
          fi
          echo "head=$RepairHead" >> "$GITHUB_OUTPUT"

      - name: Verify the committed repair tree
        env:
          BASE_SHA: ${{ needs.verify-headers.outputs.base }}
          REPAIR_HEAD: ${{ steps.repair.outputs.head }}
          SOURCE_ROOT: ${{ steps.target.outputs.source-root }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python .github/scripts/VerifySpdxHeaders.py \
            --base "$BASE_SHA" \
            --head "$REPAIR_HEAD" \
            --worktree "$SOURCE_ROOT"
          if [ -n "$(git -C "$SOURCE_ROOT" status --porcelain)" ]; then
            echo "::error::The repaired worktree is not clean."
            exit 1
          fi

      - name: Push only if the event head is still current
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ needs.verify-headers.outputs.head }}
          SOURCE_ROOT: ${{ steps.target.outputs.source-root }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git check-ref-format --branch "$HEAD_REF" >/dev/null; then
            echo "::error::The pull request head branch is not a valid branch name."
            exit 1
          fi
          NormalizedRef="${HEAD_REF,,}"
          case "$NormalizedRef" in
            main|master|release|release/*)
              echo "::error::Protected branches cannot be remediation targets."
              exit 1
              ;;
          esac
          HEAD_TARGET="refs/heads/$HEAD_REF"
          if ! git check-ref-format "$HEAD_TARGET"; then
            echo "::error::The explicit pull request head ref is invalid."
            exit 1
          fi
          BasicToken="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          AuthHeader="AUTHORIZATION: basic $BasicToken"
          RemoteLine="$(git -c http.https://github.com/.extraheader="$AuthHeader" \
            ls-remote --refs --exit-code origin "$HEAD_TARGET")"
          read -r RemoteSha RemoteRef ExtraField <<< "$RemoteLine"
          if ! [[ "$RemoteSha" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi
          if [ -n "${ExtraField:-}" ] || [ "$RemoteRef" != "$HEAD_TARGET" ]; then
            exit 1
          fi
          if [ "$RemoteSha" != "$HEAD_SHA" ]; then
            echo "::error::The pull request head advanced; refusing a stale repair."
            exit 1
          fi
          git -C "$SOURCE_ROOT" \
            -c http.https://github.com/.extraheader="$AuthHeader" \
            push --force-with-lease="$HEAD_TARGET:$HEAD_SHA" \
            origin "HEAD:$HEAD_TARGET"

      - name: Persist the remediation attempt for this head
        env:
          REPAIR_HEAD: ${{ steps.repair.outputs.head }}
        run: |
          mkdir -p "$RUNNER_TEMP/SpdxHeaderRemediation"
          printf '%s\n' "$REPAIR_HEAD" \
            > "$RUNNER_TEMP/SpdxHeaderRemediation/Attempt"

      - name: Save remediation state for this head
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/SpdxHeaderRemediation
          key: >-
            SpdxHeaderRemediation-${{ github.repository_id }}-${{
              github.event.pull_request.number
            }}-${{ needs.verify-headers.outputs.head }}

  reject-header-failure:
    name: Reject unresolved SPDX header failure
    needs:
      - verify-headers
      - remediate-missing-headers
    if: >-
      always() &&
      needs.verify-headers.outputs.result == 'failure' &&
      needs.remediate-missing-headers.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Explain the unresolved failure
        shell: bash
        run: |
          echo "::error::SPDX verification failed and safe remediation was unavailable or unsuccessful."
          exit 1
