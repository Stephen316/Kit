name: Explicit imports

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ci-reuse:
    name: PR CI reuse (Explicit imports)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Reads immutable PR CI evidence from its originating run.
      statuses: read # Reads legacy commit-status contexts.
      checks: read # Verifies current PR check health before reuse.
      pull-requests: read # Reads queued PR heads and compares candidate membership.
    outputs:
      reuse: ${{ steps.reports.outputs.reuse }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.merge_group.base_sha }}

      - name: Verify reusable PR CI reports
        id: reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const Reports = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/CiReports.cjs`);
            await Reports.SetReuse({ github, context, core });

  verify-imports:
    if: >-
      always() && !cancelled() && (github.event_name != 'merge_group' || (needs.pr-ci-reuse.result == 'success' && needs.pr-ci-reuse.outputs.reuse != 'true'))
    needs: pr-ci-reuse
    name: Reject Python wildcard imports
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --python 3.11

      - name: Verify explicit Python imports
        run: |
          uv run python - <<'PYTHON'
          import ast as AstLib
          import os as OsTools
          import subprocess as Subprocess
          import sys as System
          from pathlib import Path as FilePath

          PathData = Subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.py", ":(top,exclude)re/**"]
          )
          FilePaths = sorted(
              FilePath(OsTools.fsdecode(PathBytes))
              for PathBytes in PathData.split(b"\0")
              if PathBytes
          )
          FindingList = []
          for SourcePath in FilePaths:
              try:
                  SourceText = SourcePath.read_text(encoding="utf-8")
                  SyntaxTree = AstLib.parse(SourceText, filename=str(SourcePath))
              except (OSError, SyntaxError, UnicodeError) as ErrorInfo:
                  print(f"{SourcePath.as_posix()}: unable to inspect imports: {ErrorInfo}")
                  raise SystemExit(2) from ErrorInfo
              for AstNode in AstLib.walk(SyntaxTree):
                  if isinstance(AstNode, AstLib.ImportFrom) and any(
                      AliasInfo.name == "*" for AliasInfo in AstNode.names
                  ):
                      FindingList.append(
                          f"{SourcePath.as_posix()}:{AstNode.lineno}: wildcard import"
                      )
          for FindingText in FindingList:
              print(FindingText)
          if FindingList:
              raise SystemExit(1)
          print(f"explicit imports passed for {len(FilePaths)} python files")
          PYTHON
