name: Merge queue

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-end-to-end:
    if: github.event_name == 'merge_group'
    name: Run the complete test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run all tests
        run: uv run pytest

  analyze:
    if: github.event_name == 'merge_group'
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read # Reads workflow metadata for CodeQL Actions analysis.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            queries: ""
          - language: python
            queries: ./.github/CodeQL/PythonMaximal.qls
    steps:
      - name: Checkout repository
        # yamllint disable-line rule:comments
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare CodeQL model extensions
        shell: bash
        run: |
          mkdir -p .github/codeql
          cp -R .github/CodeQL/extensions .github/codeql/extensions

      - name: Initialize CodeQL
        # yamllint disable-line rule:comments rule:line-length
        uses: github/codeql-action/init@faaa5d804fc648d0fdb28822a8e36cf7d0a6132c # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/CodeQL/CodeqlConfig.yml
          queries: ${{ matrix.queries }}

      - name: Analyze repository
        id: analysis
        # yamllint disable-line rule:comments rule:line-length
        uses: github/codeql-action/analyze@faaa5d804fc648d0fdb28822a8e36cf7d0a6132c # v4.37.7
        with:
          category: /language:${{ matrix.language }}
          post-processed-sarif-path: CodeqlResults
          upload: never
          upload-database: false

      - name: Block reported findings
        run: |
          mapfile -d '' SarifFiles < <(
            find CodeqlResults -type f -name '*.sarif' -print0
          )
          if [ "${#SarifFiles[@]}" -eq 0 ]; then
            echo "::error::CodeQL produced no SARIF output"
            exit 1
          fi
          FindingCount="$(
            jq -s '[
              .[].runs[]?.results[]?
              | select(any(.suppressions[]?; .kind == "inSource") | not)
            ] | length' "${SarifFiles[@]}"
          )"
          if [ "$FindingCount" -ne 0 ]; then
            jq -rs '
              .[]
              | .runs[]?
              | .results[]?
              | select(any(.suppressions[]?; .kind == "inSource") | not)
              | {
                  Rule: (.ruleId // "unknown-rule"),
                  Level: (.level // "warning"),
                  Message: (
                    (.message.text // .message.markdown // "No message")
                    | gsub("[\\r\\n]+"; " ")
                  ),
                  Uri: (
                    .locations[0].physicalLocation.artifactLocation.uri
                    // "unknown-location"
                  ),
                  Line: (
                    .locations[0].physicalLocation.region.startLine // 0
                  ),
                  Column: (
                    .locations[0].physicalLocation.region.startColumn // 0
                  )
                }
              | "\(.Uri):\(.Line):\(.Column): "
                + "[\(.Level)] \(.Rule): \(.Message)"
            ' "${SarifFiles[@]}"
            echo "::error::CodeQL reported $FindingCount blocking findings"
            exit 1
          fi
          echo "CodeQL reported no findings"

  bandit:
    if: github.event_name == 'merge_group'
    name: Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run Bandit SAST
        run: uv run bandit -q -r src tools .github/scripts -x .venv,examples,Parashell,modules,re,tests -s B101,B105,B314,B404,B405,B603,B607

  semgrep:
    if: github.event_name == 'merge_group'
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run Semgrep SAST
        run: uv run semgrep scan --config=p/default --error --metrics=off --timeout=30 --exclude=.venv --exclude=examples --exclude=Parashell --exclude=modules --exclude=re

  pip-audit:
    if: github.event_name == 'merge_group'
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run pip-audit SCA
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/runtime-requirements.txt"
          uv run pip-audit --strict --requirement "${RUNNER_TEMP}/runtime-requirements.txt"

  safety:
    if: github.event_name == 'merge_group'
    name: Safety
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run Safety SCA
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/runtime-requirements.txt"
          uv run safety check --file "${RUNNER_TEMP}/runtime-requirements.txt" --output text

  checkov:
    if: github.event_name == 'merge_group'
    name: Checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run Checkov IaC
        run: uv run checkov --directory . --quiet --skip-framework secrets --skip-path .venv --skip-path examples --skip-path re

  detect-secrets:
    if: github.event_name == 'merge_group'
    name: detect-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run detect-secrets
        run: uv run detect-secrets scan --all-files --exclude-files '(^\.venv/|^examples/|^re/|^uv\.lock$)' --only-verified

  syft:
    if: github.event_name == 'merge_group'
    name: Syft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Syft
        env:
          SyftVersion: "1.51.0"
          SyftSha256: 2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f
        run: |
          set -euo pipefail
          ArchivePath="${RUNNER_TEMP}/syft_${SyftVersion}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${ArchivePath}" \
            "https://github.com/anchore/syft/releases/download/v${SyftVersion}/syft_${SyftVersion}_linux_amd64.tar.gz"
          echo "${SyftSha256}  ${ArchivePath}" | sha256sum --check --
          tar --extract --gzip --file "${ArchivePath}" --directory "${RUNNER_TEMP}" syft
          chmod u+x "${RUNNER_TEMP}/syft"

      - name: Generate the independent runtime SBOM
        run: '"${RUNNER_TEMP}/syft" scan uv.lock -o cyclonedx-json="${RUNNER_TEMP}/Kit.syft.cdx.json"'

      - name: Cross-check SBOM catalog coverage
        run: |
          set -euo pipefail
          jq -e '[.components[].name] | index("defusedxml") != null and index("typing-extensions") != null' \
            "${RUNNER_TEMP}/Kit.syft.cdx.json"

  cyclonedx-sbom:
    if: github.event_name == 'merge_group'
    name: CycloneDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Export locked runtime requirements
        run: uv export --frozen --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/RuntimeRequirements.txt"

      - name: Generate validated runtime SBOM
        run: >-
          uv run cyclonedx-py requirements "${RUNNER_TEMP}/RuntimeRequirements.txt"
          --outfile "${RUNNER_TEMP}/Kit.cdx.json" --of JSON --sv 1.6
          --output-reproducible --mc-type application

  dlint:
    if: github.event_name == 'merge_group'
    name: dlint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run dlint insecure-pattern scan
        run: >-
          uv run flake8 --select=DUO
          --exclude=.venv,examples,Parashell,modules,re,tests
          src tools .github/scripts

  gitleaks:
    if: github.event_name == 'merge_group'
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        env:
          GitleaksVersion: "8.30.1"
          GitleaksSha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          ArchivePath="${RUNNER_TEMP}/gitleaks_${GitleaksVersion}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${ArchivePath}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GitleaksVersion}/gitleaks_${GitleaksVersion}_linux_x64.tar.gz"
          echo "${GitleaksSha256}  ${ArchivePath}" | sha256sum --check --
          tar --extract --gzip --file "${ArchivePath}" --directory "${RUNNER_TEMP}" gitleaks
          chmod u+x "${RUNNER_TEMP}/gitleaks"

      - name: Run Gitleaks history secret audit
        run: >-
          "${RUNNER_TEMP}/gitleaks" git
          --config .github/config/Gitleaks.toml
          --log-opts="--full-history --diff-filter=tuxdb HEAD"
          --redact --verbose .

  grype:
    if: github.event_name == 'merge_group'
    name: Grype
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Export locked runtime requirements
        run: uv export --frozen --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/RuntimeRequirements.txt"

      - name: Build the CycloneDX manifest
        run: >-
          uv run cyclonedx-py requirements "${RUNNER_TEMP}/RuntimeRequirements.txt"
          --outfile "${RUNNER_TEMP}/Kit.cdx.json" --of JSON --sv 1.6
          --output-reproducible --mc-type application

      - name: Install pinned Grype
        env:
          GrypeVersion: "0.117.0"
          GrypeSha256: 38525dab1e06f162ebaa02f94d82d1f807076b011a44180cf2777edf1a7b9c26
        run: |
          set -euo pipefail
          ArchivePath="${RUNNER_TEMP}/grype_${GrypeVersion}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${ArchivePath}" \
            "https://github.com/anchore/grype/releases/download/v${GrypeVersion}/grype_${GrypeVersion}_linux_amd64.tar.gz"
          echo "${GrypeSha256}  ${ArchivePath}" | sha256sum --check --
          tar --extract --gzip --file "${ArchivePath}" --directory "${RUNNER_TEMP}" grype
          chmod u+x "${RUNNER_TEMP}/grype"

      - name: Run Grype vulnerability scan
        env:
          GRYPE_CONFIG: .github/config/Grype.yaml
        run: '"${RUNNER_TEMP}/grype" sbom:"${RUNNER_TEMP}/Kit.cdx.json" --fail-on low'

  osv-scanner:
    if: github.event_name == 'merge_group'
    name: OSV-Scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned OSV-Scanner
        env:
          OsvScannerVersion: "2.5.1"
          OsvScannerSha256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
        run: |
          set -euo pipefail
          BinaryPath="${RUNNER_TEMP}/osv-scanner"
          curl --fail --silent --show-error --location \
            --output "${BinaryPath}" \
            "https://github.com/google/osv-scanner/releases/download/v${OsvScannerVersion}/osv-scanner_linux_amd64"
          echo "${OsvScannerSha256}  ${BinaryPath}" | sha256sum --check --
          chmod u+x "${BinaryPath}"

      - name: Run OSV-Scanner lockfile audit
        run: '"${RUNNER_TEMP}/osv-scanner" scan source --lockfile=uv.lock --config .github/config/OsvScanner.toml'

  scorecard:
    if: github.event_name == 'merge_group'
    name: Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard supply-chain audit
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: Scorecard.sarif
          results_format: sarif
          publish_results: false
          repo_token: ${{ github.token }}

      - name: Summarize Scorecard results
        run: |
          set -euo pipefail
          jq -r '.runs[0].results[] | [.ruleId, (.message.text // "")] | @tsv' Scorecard.sarif

  trivy:
    if: github.event_name == 'merge_group'
    name: Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Trivy
        env:
          TrivyVersion: "0.74.0"
          TrivySha256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          ArchivePath="${RUNNER_TEMP}/trivy_${TrivyVersion}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${ArchivePath}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TrivyVersion}/trivy_${TrivyVersion}_Linux-64bit.tar.gz"
          echo "${TrivySha256}  ${ArchivePath}" | sha256sum --check --
          tar --extract --gzip --file "${ArchivePath}" --directory "${RUNNER_TEMP}" trivy
          chmod u+x "${RUNNER_TEMP}/trivy"

      - name: Run Trivy filesystem audit
        run: >-
          "${RUNNER_TEMP}/trivy" fs
          --scanners vuln,misconfig,secret
          --skip-dirs .venv,examples,Parashell,modules,re
          --ignorefile .github/config/TrivyIgnore.txt
          --exit-code 1 .

  trufflehog:
    if: github.event_name == 'merge_group'
    name: TruffleHog
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned TruffleHog
        env:
          TrufflehogVersion: "3.97.0"
          TrufflehogSha256: 62224de2f9dd7cd418800feb953760a302ed2f82a7c547fe1146a4874fb179e4
        run: |
          set -euo pipefail
          ArchivePath="${RUNNER_TEMP}/trufflehog_${TrufflehogVersion}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${ArchivePath}" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TrufflehogVersion}/trufflehog_${TrufflehogVersion}_linux_amd64.tar.gz"
          echo "${TrufflehogSha256}  ${ArchivePath}" | sha256sum --check --
          tar --extract --gzip --file "${ArchivePath}" --directory "${RUNNER_TEMP}" trufflehog
          chmod u+x "${RUNNER_TEMP}/trufflehog"

      - name: Run TruffleHog verified secret scan
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/TrufflehogExcludes" <<'EOF'
          (^|/)\.venv/
          (^|/)examples/
          (^|/)Parashell/
          (^|/)modules/
          (^|/)re/
          EOF
          "${RUNNER_TEMP}/trufflehog" git file://. \
            --only-verified \
            --exclude-paths="${RUNNER_TEMP}/TrufflehogExcludes"

  gate:
    name: Merge queue acceptance
    if: always()
    needs:
      [
        verify-end-to-end,
        analyze,
        bandit,
        semgrep,
        pip-audit,
        safety,
        checkov,
        detect-secrets,
        syft,
        cyclonedx-sbom,
        dlint,
        gitleaks,
        grype,
        osv-scanner,
        scorecard,
        trivy,
        trufflehog,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # Correlates the aggregate with its originating workflow run.
      checks: read # Requires the queue's static CI aggregate before acceptance passes.
    env:
      EVENT_NAME: ${{ github.event_name }}
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Enforce the validation phase
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "$JOB_RESULTS" | jq --exit-status 'length > 0 and all(.[]; .result == "skipped")'
            echo "Acceptance and heavy security scans are deferred to the merge queue" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EVENT_NAME" = merge_group ]; then
            echo "$JOB_RESULTS" | jq --exit-status 'length > 0 and all(.[]; .result == "success")'
            echo "Every acceptance and heavy security job passed on this merge-group candidate" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Unsupported validation phase"
            exit 1
          fi

      - name: Require the queue candidate CI aggregate
        if: github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const Deadline = Date.now() + 85 * 60000;
            for (;;) {
              const HeadSha = context.payload.merge_group.head_sha;
              const Runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo, head_sha: HeadSha, event: "merge_group", per_page: 100,
              });
              const Run = Runs.filter((Item) => Item.path?.split("@")[0] === ".github/workflows/PullRequest.yml")
                .sort((Left, Right) => Right.id - Left.id)[0];
              if (Run) {
                if (Run.status === "completed" && Run.conclusion !== "success") {
                  throw new Error(`The aggregate workflow did not pass: ${Run.conclusion}`);
                }
                const Checks = await github.paginate(github.rest.checks.listForSuite, {
                  ...context.repo, check_suite_id: Run.check_suite_id,
                  filter: "latest", per_page: 100,
                });
                const Aggregate = Checks.filter((Check) => Check.name === "CI Agg" &&
                  Check.app?.id === 15368 && Check.head_sha === HeadSha)
                  .sort((Left, Right) => Right.id - Left.id)[0];
                if (Aggregate?.status === "completed" && Aggregate.conclusion !== "success") {
                  throw new Error(`CI Agg did not pass: ${Aggregate.conclusion}`);
                }
                if (Aggregate?.conclusion === "success" && Run.status === "completed" && Run.conclusion === "success") {
                  await core.summary.addRaw(`Candidate static CI aggregate passed: ${Run.html_url}\n`).write();
                  break;
                }
              }
              if (Date.now() >= Deadline) throw new Error("Missing or pending candidate CI Agg");
              await new Promise((Resolve) => setTimeout(Resolve, 30000));
            }
