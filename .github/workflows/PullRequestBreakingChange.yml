name: Pull request breaking change label

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Labels API metadata without executing PR code.
    types:
      - edited
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-breaking-change:
    name: Label declared breaking changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Reads pull request metadata through GitHub's API.
      issues: write # Creates the breaking-change label when missing.
      pull-requests: write # Applies and removes the breaking-change label.
    steps:
      - name: Apply breaking change label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const LabelName = "Breaking Change";
            const PullNumber = context.payload.pull_request.number;
            const PullTitle = context.payload.pull_request.title;
            const PullText = `${PullTitle}\n${context.payload.pull_request.body ?? ""}`;
            const IsMatched =
              /(?:^|\n)BREAKING(?: |-)?CHANGE:\s+\S/im.test(PullText) ||
              /^[a-z][a-z0-9-]*(?:\([^\r\n)]+\))?!:/i.test(PullTitle) ||
              /^\[breaking(?: change)?\]/i.test(PullTitle);

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LabelName,
              });
            } catch (ErrorInfo) {
              if (ErrorInfo.status !== 404) throw ErrorInfo;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LabelName,
                color: "b60205",
              });
            }

            if (IsMatched) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: PullNumber,
                labels: [LabelName],
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: PullNumber,
                  name: LabelName,
                });
              } catch (ErrorInfo) {
                if (ErrorInfo.status !== 404) throw ErrorInfo;
              }
            }
