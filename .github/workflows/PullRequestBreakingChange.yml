name: Pull request breaking change label

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Labels API metadata without executing PR code.
    types:
      - edited
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  label-breaking-change:
    name: Label declared breaking changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Reads pull request metadata through GitHub's API.
      issues: write # Creates the breaking-change label when missing.
      pull-requests: write # Applies and removes the breaking-change label.
    steps:
      - name: Apply breaking change label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LabelName = "Breaking Change";
            const PullNumber = context.payload.pull_request.number;
            const PullTarget = { ...context.repo, pull_number: PullNumber };
            const IssueTarget = { ...context.repo, issue_number: PullNumber };
            const RepositoryLabel = { ...context.repo, name: LabelName };

            async function EnsureLabel() {
              try {
                await github.rest.issues.getLabel(RepositoryLabel);
              } catch (ErrorInfo) {
                if (ErrorInfo.status !== 404) throw ErrorInfo;
                try {
                  await github.rest.issues.createLabel({
                    ...RepositoryLabel,
                    color: "b60205",
                  });
                } catch (CreateError) {
                  if (CreateError.status !== 422) throw CreateError;
                  await github.rest.issues.getLabel(RepositoryLabel);
                }
              }
            }

            async function ApplyLabel(IsDeclared) {
              if (IsDeclared) {
                await github.rest.issues.addLabels({
                  ...IssueTarget,
                  labels: [LabelName],
                });
                return;
              }
              try {
                await github.rest.issues.removeLabel({
                  ...IssueTarget,
                  name: LabelName,
                });
              } catch (ErrorInfo) {
                if (ErrorInfo.status !== 404) throw ErrorInfo;
              }
            }

            function IsBreaking(PullRequest) {
              const PullText = `${PullRequest.title}\n${PullRequest.body ?? ""}`;
              return (
                /(?:^|\n)BREAKING(?: |-)?CHANGE:\s+\S/im.test(PullText) ||
                /^[a-z][a-z0-9-]*(?:\([^\r\n)]+\))?!:/i.test(PullRequest.title) ||
                /^\[breaking(?: change)?\]/i.test(PullRequest.title)
              );
            }

            function HasBreakLabel(PullRequest) {
              return PullRequest.labels.some(
                (Label) => Label.name.toLowerCase() === LabelName.toLowerCase(),
              );
            }

            await EnsureLabel();
            let { data: PullRequest } = await github.rest.pulls.get(PullTarget);
            for (let Attempt = 0; Attempt < 3; Attempt += 1) {
              const IsDeclared = IsBreaking(PullRequest);
              if (IsDeclared === HasBreakLabel(PullRequest)) return;
              await ApplyLabel(IsDeclared);
              ({ data: PullRequest } = await github.rest.pulls.get(PullTarget));
            }
            if (IsBreaking(PullRequest) !== HasBreakLabel(PullRequest)) {
              throw new Error("Breaking change label did not match current PR metadata");
            }
