name: Pull request documentation label

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Labels API metadata without executing PR code.
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-documentation:
    name: Label documentation changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Reads changed paths through GitHub's API.
      issues: write # Creates the documentation label when missing.
      pull-requests: write # Applies and removes the documentation label.
    steps:
      - name: Apply documentation label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const LabelName = "Documentation";
            const PullNumber = context.payload.pull_request.number;
            const FileList = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: PullNumber,
              per_page: 100,
            });
            const IsMatched = FileList.some((FileInfo) => {
              const PathText = FileInfo.filename;
              return (
                !PathText.startsWith("re/") &&
                (/\.(?:md|mdx|rst)$/i.test(PathText) || PathText.startsWith("docs/"))
              );
            });

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LabelName,
              });
            } catch (ErrorInfo) {
              if (ErrorInfo.status !== 404) throw ErrorInfo;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LabelName,
                color: "0075ca",
              });
            }

            if (IsMatched) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: PullNumber,
                labels: [LabelName],
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: PullNumber,
                  name: LabelName,
                });
              } catch (ErrorInfo) {
                if (ErrorInfo.status !== 404) throw ErrorInfo;
              }
            }
