name: Pull request direction label

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Labels API metadata without executing PR code.
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-direction:
    name: Label dominant change direction
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Reads pull request metadata through GitHub's API.
      issues: write # Creates missing direction labels.
      pull-requests: write # Applies and removes direction labels.
    steps:
      - name: Apply direction label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        with:
          script: |
            const LabelColors = {
              Additions: "1f883d",
              Removals: "8250df",
            };
            const Additions = Number(process.env.ADDITIONS);
            const Deletions = Number(process.env.DELETIONS);
            const SelectedLabel =
              Additions > Deletions
                ? "Additions"
                : Deletions > Additions
                  ? "Removals"
                  : null;
            const PullNumber = context.payload.pull_request.number;
            const ExistingLabels = new Set(
              context.payload.pull_request.labels.map((LabelInfo) => LabelInfo.name),
            );

            for (const [LabelName, LabelColor] of Object.entries(LabelColors)) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: LabelName,
                });
              } catch (ErrorInfo) {
                if (ErrorInfo.status !== 404) throw ErrorInfo;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: LabelName,
                  color: LabelColor,
                });
              }
            }

            if (SelectedLabel && !ExistingLabels.has(SelectedLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: PullNumber,
                labels: [SelectedLabel],
              });
            }

            for (const LabelName of Object.keys(LabelColors)) {
              if (LabelName === SelectedLabel || !ExistingLabels.has(LabelName)) continue;
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: PullNumber,
                name: LabelName,
              });
            }
