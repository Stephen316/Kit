name: Pull Request

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Reads metadata with trusted base code, read-only permissions, and no PR code checkout.
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.merge_group.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  ci-agg:
    name: CI Agg
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # Reads exact-revision workflow runs and PR CI evidence.
      statuses: read # Reads legacy commit-status contexts.
      checks: read # Aggregates current check results without modifying them.
      pull-requests: read # Verifies PR heads and native queue membership.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}

      - name: Aggregate all applicable CI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const Reports = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/CiReports.cjs`);
            await Reports.Aggregate({ github, context, core });

      - name: Publish immutable PR CI evidence
        id: evidence
        if: github.event_name != 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PrCiEvidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/PrCiEvidence/Evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify the published evidence through GitHub
        if: github.event_name != 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_CI_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
        with:
          script: |
            const Reports = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/CiReports.cjs`);
            await Reports.VerifyEvidence({ github, context, core });
