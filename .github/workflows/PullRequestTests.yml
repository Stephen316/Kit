name: Pull request tests label

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Labels API metadata without executing PR code.
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-tests:
    name: Label test changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Reads changed paths through GitHub's API.
      issues: write # Creates the tests label when missing.
      pull-requests: write # Applies and removes the tests label.
    steps:
      - name: Apply tests label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LabelName = "Tests";
            const PullNumber = context.payload.pull_request.number;
            const FileList = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: PullNumber,
              per_page: 100,
            });
            const IsMatched = FileList.some(
              (FileInfo) =>
                !FileInfo.filename.startsWith("re/") &&
                FileInfo.filename.startsWith("tests/"),
            );

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LabelName,
              });
            } catch (ErrorInfo) {
              if (ErrorInfo.status !== 404) throw ErrorInfo;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LabelName,
                color: "1d76db",
              });
            }

            if (IsMatched) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: PullNumber,
                labels: [LabelName],
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: PullNumber,
                  name: LabelName,
                });
              } catch (ErrorInfo) {
                if (ErrorInfo.status !== 404) throw ErrorInfo;
              }
            }
