name: Workflow pins

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ci-reuse:
    name: PR CI reuse (Workflow pins)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Reads immutable PR CI evidence from its originating run.
      statuses: read # Reads legacy commit-status contexts.
      checks: read # Verifies current PR check health before reuse.
      pull-requests: read # Reads queued PR heads and compares candidate membership.
    outputs:
      reuse: ${{ steps.reports.outputs.reuse }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.merge_group.base_sha }}

      - name: Verify reusable PR CI reports
        id: reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const Reports = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/CiReports.cjs`);
            await Reports.SetReuse({ github, context, core });

  verify-workflow-pins:
    if: >-
      always() && !cancelled() && (github.event_name != 'merge_group' || (needs.pr-ci-reuse.result == 'success' && needs.pr-ci-reuse.outputs.reuse != 'true'))
    needs: pr-ci-reuse
    name: Verify immutable workflow dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --python 3.11

      - name: Verify action and runner pins
        run: |
          uv run python - <<'PYTHON'
          import os as OsTools
          import re as Regex
          import subprocess as Subprocess
          from pathlib import Path as FilePath

          PathData = Subprocess.check_output(
              [
                  "git",
                  "ls-files",
                  "-z",
                  "--",
                  ".github/workflows/*.yml",
                  ".github/workflows/*.yaml",
              ]
          )
          WorkflowPaths = sorted(
              FilePath(OsTools.fsdecode(PathBytes))
              for PathBytes in PathData.split(b"\0")
              if PathBytes
          )
          UsePattern = Regex.compile(
              r"^\s*(?:-\s*)?uses:\s*([^\s#]+)\s*(?:#\s*(.+))?$"
          )
          RunnerPattern = Regex.compile(r"^\s*runs-on:\s*([^\s#]+)")
          VersionPattern = Regex.compile(
              r"^v[0-9]+(?:\.[0-9]+)*(?:[-+][A-Za-z0-9.-]+)?$"
          )
          AllowedRunner = Regex.compile(
              r"^(?:ubuntu-[0-9]{2}\.[0-9]{2}|windows-[0-9]{4}|macos-[0-9]+|self-hosted)$"
          )
          FindingList = []
          for WorkflowPath in WorkflowPaths:
              SourceLines = WorkflowPath.read_text(encoding="utf-8").splitlines()
              for LineNumber, LineText in enumerate(SourceLines, start=1):
                  UseMatch = UsePattern.match(LineText)
                  if UseMatch is not None:
                      UseText, VersionText = UseMatch.groups()
                      if not UseText.startswith("./"):
                          ActionText, MarkerText, RefText = UseText.rpartition("@")
                          if (
                              not ActionText
                              or MarkerText != "@"
                              or Regex.fullmatch(r"[0-9a-f]{40}", RefText) is None
                              or VersionText is None
                              or VersionPattern.fullmatch(VersionText) is None
                          ):
                              FindingList.append(
                                  f"{WorkflowPath.as_posix()}:{LineNumber}: unpinned action {UseText}"
                              )
                  RunnerMatch = RunnerPattern.match(LineText)
                  if RunnerMatch is not None and AllowedRunner.fullmatch(
                      RunnerMatch.group(1)
                  ) is None:
                      FindingList.append(
                          f"{WorkflowPath.as_posix()}:{LineNumber}: unpinned runner {RunnerMatch.group(1)}"
                      )
          for FindingText in FindingList:
              print(FindingText)
          if FindingList:
              raise SystemExit(1)
          print(f"workflow pins passed for {len(WorkflowPaths)} files")
          PYTHON
