name: Release artifacts

on:
  pull_request:

permissions: {}

concurrency:
  group: ReleaseBuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Build and verify release artifacts
        shell: bash
        run: |
          shellcheck .github/scripts/BuildRelease.sh
          bash .github/scripts/BuildRelease.sh

      - name: Save GitHub release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source/
            ${{ runner.temp }}/CommitDetails.md
          if-no-files-found: error
          compression-level: 0

      - name: Save PyPI distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ github.run_attempt }}
          path: ${{ runner.temp }}/distributions/
          if-no-files-found: error
