name: Workflow quality

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: WorkflowQuality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ci-reuse:
    name: PR CI reuse (Workflow quality)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Reads immutable PR CI evidence from its originating run.
      statuses: read # Reads legacy commit-status contexts.
      checks: read # Verifies current PR check health before reuse.
      pull-requests: read # Reads queued PR heads and compares candidate membership.
    outputs:
      reuse: ${{ steps.reports.outputs.reuse }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.merge_group.base_sha }}

      - name: Verify reusable PR CI reports
        id: reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const Reports = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/CiReports.cjs`);
            await Reports.SetReuse({ github, context, core });

  policy:
    if: >-
      always() && !cancelled() && (github.event_name != 'merge_group' || (needs.pr-ci-reuse.result == 'success' && needs.pr-ci-reuse.outputs.reuse != 'true'))
    needs: pr-ci-reuse
    name: Verify CI policy and pytest compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Verify repository CI contracts at process boundaries
        run: >-
          uv run pytest tests/Policy/CodeqlPolicyTests.py
          tests/Policy/CiReportsTests.py tests/Policy/QueueAggregationTests.py
          tests/Policy/ReviewerAggregationTests.py tests/steering/AgentSkillsMigrationTests.py
          tests/convert/api/ApiMetadataTests.py tests/Policy/DiffBreakdownTests.py
          tests/Policy/ShardPlanTests.py

      - name: Census the SOLIDWORKS discovery captures
        run: >-
          uv run --frozen python re/automation/SolidworksCensus.py
          --output "${RUNNER_TEMP}/SolidworksDiscoveryCensus.json"

      - name: Publish SOLIDWORKS discovery census
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SolidworksDiscoveryCensus-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SolidworksDiscoveryCensus.json
          if-no-files-found: error
          retention-days: 14

      - name: Check SOLIDWORKS cut-centering equation bindings
        run: >-
          uv run --frozen python re/automation/SolidworksCensus.py
          --check-equations "${RUNNER_TEMP}/SolidworksDiscoveryCensus.json"

      - name: Check SOLIDWORKS cut termination evidence
        run: >-
          uv run --frozen python re/automation/SolidworksCensus.py
          --check-cut-terminations "${RUNNER_TEMP}/SolidworksDiscoveryCensus.json"

      - name: Check SOLIDWORKS blind boss direction
        run: >-
          uv run --frozen python re/automation/SolidworksCensus.py
          --check-directions "${RUNNER_TEMP}/SolidworksDiscoveryCensus.json"

      - name: Check SOLIDWORKS rectangle edge topology
        run: >-
          uv run --frozen python re/automation/SolidworksCensus.py
          --check-rectangle-edges "${RUNNER_TEMP}/SolidworksDiscoveryCensus.json"

      - name: Check SOLIDWORKS principal support evidence
        run: >-
          uv run --frozen python re/automation/SolidworksCensus.py
          --check-support-evidence "${RUNNER_TEMP}/SolidworksDiscoveryCensus.json"

      - name: Check SOLIDWORKS resolved-feature inch lengths
        run: >-
          uv run --frozen python re/automation/SolidworksCensus.py
          --check-resolved-lengths "${RUNNER_TEMP}/SolidworksDiscoveryCensus.json"

      - name: Exercise native file reading and writing
        run: >-
          uv run pytest
          tests/convert/solidworks
          tests/convert/formats/ParasolidTests.py
          tests/convert/api/ApiTests.py
          tests/convert/api/ApiSupportTests.py
          tests/convert/registry
          tests/convert/qualification
          tests/steering/RationaleCommentsTests.py

      - name: Verify typed carrier compatibility at native write boundaries
        run: >-
          uv run --frozen python -m pytest
          tests/convert/catia/CatiaTests.py::TestRoundtripIs
          tests/convert/catia/CatiaTests.py::TestPublicSdkTo
          tests/convert/catia/CatiaTests.py::TestGeneratedC
          tests/convert/catia/CatiaTests.py::TestStripped
          tests/convert/catia/CatiaTests.py::TestTypedKind
          tests/convert/catia/CatiaTests.py::TestModifiedDoc
          tests/convert/catia/CatiaTests.py::TestEmbeddedAnd
          tests/convert/catia/CatiaTests.py::TestGeneratedA
          tests/convert/catia/CatiaTests.py::TestGeneratedD
          tests/convert/catia/CatiaTests.py::TestForeignRole
          tests/convert/catia/CatiaTests.py::TestLegacyDocIs
          tests/convert/catia/CatiaTests.py::TestForeign
          tests/convert/catia/CatiaTests.py::TestReaderKind
          tests/convert/catia/CatiaTests.py::TestConversion
          tests/convert/catia/CatiaAssemblyTests.py::TestChangedBase
          tests/convert/catia/CatiaAssemblyTests.py::TestCatproductO
          tests/convert/freecad/FreecadTests.py::TestFeatureAnd
          tests/convert/freecad/FreecadTests.py::TestNonFeature
          tests/convert/freecad/FreecadTests.py::TestStrictTo
          tests/convert/freecad/FreecadTests.py::TestDirectFcstd
          tests/convert/freecad/FreecadTests.py::TestFcstd
          tests/convert/freecad/FreecadTests.py::TestFcstdOutput
          tests/convert/freecad/FreecadTests.py::TestFcstdStream
          tests/convert/freecad/FreecadTests.py::TestSolidworksA
          tests/convert/freecad/FreecadTests.py::TestSolidworksB
          tests/convert/freecad/FreecadTests.py::TestSolidworks
          -q

      - name: Verify pinned research corpus and command boundaries
        run: |
          uv run python re/automation/Corpus.py check --manifest re/automation/Corpus.json
          uv run pytest tests/Research/CorpusFlowTests.py tests/Research/FusionCapturePlanTests.py -q

      - name: Verify pinned SOLIDWORKS research reader through process boundaries
        run: uv run --frozen python -m pytest tests/Research/Reader*Tests.py -q -s

      - name: Verify durable research output intake through process boundaries
        run: >-
          uv run --frozen --no-default-groups --extra dev --python 3.14
          python -m pytest tests/Research/Outputs tests/Research/Applications -q

      - name: Verify pinned Fusion research reader through process boundaries
        env:
          KIT_FUSION_CENSUS: ${{ runner.temp }}/FusionReaderCensus.json
        run: >-
          uv run --frozen --no-default-groups --extra dev --python 3.14
          python -m pytest tests/Research/FusionReader*Tests.py -q -s

      - name: Publish Fusion research reader census
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FusionReaderCensus-${{ github.run_attempt }}
          path: ${{ runner.temp }}/FusionReaderCensus.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify durable research controller through process boundaries
        run: >-
          uv run --frozen --no-default-groups --extra dev --python 3.14
          python -m pytest tests/Research/Controller*Tests.py -q

      - name: Verify research session supervisor through process boundaries
        run: >-
          uv run --frozen --no-default-groups --extra dev --python 3.14
          python -m pytest tests/Research/Supervisor*Tests.py tests/Research/Supervisor/Supervisor*Tests.py tests/Research/Supervisor/Grouping tests/Research/Supervisor/Launch tests/Research/Owners tests/Research/Calibration -q -s

  windows-supervisor:
    if: >-
      always() && !cancelled() && (github.event_name != 'merge_group' || (needs.pr-ci-reuse.result == 'success' && needs.pr-ci-reuse.outputs.reuse != 'true'))
    needs: pr-ci-reuse
    name: Windows research supervisor
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked Windows process environment
        run: uv sync --frozen --no-default-groups --extra dev --python 3.14

      - name: Verify Windows supervisor through process boundaries
        run: >-
          uv run --frozen --no-default-groups --extra dev --python 3.14
          python -m pytest -q tests/Research/Windows tests/Research/Outputs tests/Research/Applications/ApplicationParkTests.py tests/Research/Owners tests/Research/WindowsRecords

  macos-supervisor:
    if: >-
      always() && !cancelled() && (github.event_name != 'merge_group' || (needs.pr-ci-reuse.result == 'success' && needs.pr-ci-reuse.outputs.reuse != 'true'))
    needs: pr-ci-reuse
    name: macOS research supervisor
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked macOS process environment
        run: uv sync --frozen --no-default-groups --extra dev --python 3.14

      - name: Verify macOS supervisor through process boundaries
        run: >-
          uv run --frozen --no-default-groups --extra dev --python 3.14
          python -m pytest -q -s tests/Research/Supervisor*Tests.py tests/Research/Supervisor/Supervisor*Tests.py tests/Research/Outputs tests/Research/Applications tests/Research/Supervisor/Grouping tests/Research/Supervisor/Launch tests/Research/Owners tests/Research/Calibration

  zizmor:
    if: >-
      always() && !cancelled() && (github.event_name != 'merge_group' || (needs.pr-ci-reuse.result == 'success' && needs.pr-ci-reuse.outputs.reuse != 'true'))
    needs: pr-ci-reuse
    name: Zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run Zizmor Actions audit
        run: uv run zizmor --pedantic .github/workflows

  actionlint:
    if: >-
      always() && !cancelled() && (github.event_name != 'merge_group' || (needs.pr-ci-reuse.result == 'success' && needs.pr-ci-reuse.outputs.reuse != 'true'))
    needs: pr-ci-reuse
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        env:
          ActionlintVersion: "1.7.12"
          ActionlintSha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ArchivePath="${RUNNER_TEMP}/actionlint_${ActionlintVersion}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${ArchivePath}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ActionlintVersion}/actionlint_${ActionlintVersion}_linux_amd64.tar.gz"
          echo "${ActionlintSha256}  ${ArchivePath}" | sha256sum --check --
          tar --extract --gzip --file "${ArchivePath}" --directory "${RUNNER_TEMP}" actionlint
          chmod u+x "${RUNNER_TEMP}/actionlint"

      - name: Run actionlint workflow analysis
        run: '"${RUNNER_TEMP}/actionlint"'
