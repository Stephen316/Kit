---
name: CodeQL security and quality

"on":
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read # CodeQL reads workflow metadata for analysis.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            queries: ""
          - language: python
            queries: ./.github/CodeQL/PythonMaximal.qls
    steps:
      - name: Checkout repository
        # yamllint disable-line rule:comments
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare CodeQL model extensions
        shell: bash
        run: |
          mkdir -p .github/codeql
          cp -R .github/CodeQL/extensions .github/codeql/extensions

      - name: Initialize CodeQL
        # yamllint disable-line rule:comments rule:line-length
        uses: github/codeql-action/init@faaa5d804fc648d0fdb28822a8e36cf7d0a6132c # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/CodeQL/CodeqlConfig.yml
          queries: ${{ matrix.queries }}

      - name: Analyze repository
        id: analysis
        # yamllint disable-line rule:comments rule:line-length
        uses: github/codeql-action/analyze@faaa5d804fc648d0fdb28822a8e36cf7d0a6132c # v4.37.7
        with:
          category: /language:${{ matrix.language }}
          post-processed-sarif-path: CodeqlResults
          upload: never
          upload-database: false

      - name: Block reported findings
        run: |
          mapfile -d '' SarifFiles < <(
            find CodeqlResults -type f -name '*.sarif' -print0
          )
          if [ "${#SarifFiles[@]}" -eq 0 ]; then
            echo "::error::CodeQL produced no SARIF output"
            exit 1
          fi
          FindingCount="$(
            jq -s '[
              .[].runs[]?.results[]?
              | select(any(.suppressions[]?; .kind == "inSource") | not)
            ] | length' "${SarifFiles[@]}"
          )"
          if [ "$FindingCount" -ne 0 ]; then
            jq -rs '
              .[]
              | .runs[]?
              | .results[]?
              | select(any(.suppressions[]?; .kind == "inSource") | not)
              | {
                  Rule: (.ruleId // "unknown-rule"),
                  Level: (.level // "warning"),
                  Message: (
                    (.message.text // .message.markdown // "No message")
                    | gsub("[\\r\\n]+"; " ")
                  ),
                  Uri: (
                    .locations[0].physicalLocation.artifactLocation.uri
                    // "unknown-location"
                  ),
                  Line: (
                    .locations[0].physicalLocation.region.startLine // 0
                  ),
                  Column: (
                    .locations[0].physicalLocation.region.startColumn // 0
                  )
                }
              | "\(.Uri):\(.Line):\(.Column): "
                + "[\(.Level)] \(.Rule): \(.Message)"
            ' "${SarifFiles[@]}"
            echo "::error::CodeQL reported $FindingCount blocking findings"
            exit 1
          fi
          echo "CodeQL reported no findings"
